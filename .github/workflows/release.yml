name: Release

on:
  push:
    tags:
      - 'v*'

# Default to no permissions; each job opts in to exactly what it needs.
permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the release and upload assets
      id-token: write      # sign the provenance attestation (OIDC, no stored secret)
      attestations: write  # record the attestation
    steps:
      # All third-party actions are pinned to a full commit SHA. A tag like @v4
      # is mutable and can be repointed at arbitrary code by whoever owns it.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false  # the build never needs the repo token

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.22'

      - name: Verify module builds and tests pass
        run: |
          set -euo pipefail
          go vet ./...
          go test ./...

      - name: Build binaries
        run: |
          set -euo pipefail
          mkdir -p dist

          # GITHUB_REF_NAME is read as a shell env var rather than through GitHub
          # expression interpolation, so its contents cannot break out into this
          # script. (Do not write the interpolation syntax literally anywhere in a
          # run block, even in a comment: GitHub parses it there too, and an empty
          # expression makes the whole workflow file invalid.)
          VERSION="${GITHUB_REF_NAME}"

          PLATFORMS=(
            "darwin/arm64"
            "darwin/amd64"
            "linux/amd64"
            "linux/arm64"
          )

          for PLATFORM in "${PLATFORMS[@]}"; do
            GOOS="${PLATFORM%/*}"
            GOARCH="${PLATFORM#*/}"
            OUTPUT_NAME="avdslim_${VERSION}_${GOOS}_${GOARCH}"
            DIR="dist/${OUTPUT_NAME}"
            mkdir -p "${DIR}"

            echo "Building for ${GOOS}/${GOARCH}..."
            # -trimpath keeps build paths out of the binary so builds are
            # reproducible and independently verifiable from source.
            CGO_ENABLED=0 GOOS="${GOOS}" GOARCH="${GOARCH}" \
              go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" \
              -o "${DIR}/avdslim" ./cmd/avdslim
            cp README.md LICENSE "${DIR}/"

            tar -czf "dist/${OUTPUT_NAME}.tar.gz" -C "dist" "${OUTPUT_NAME}"
          done

          # Emit BARE filenames, not "./name". install.sh matches the filename
          # column exactly, so a "./" prefix makes every lookup miss and the
          # installer refuse to install. The avdslim_ prefix keeps this glob safe
          # from being read as an option without needing "./".
          ( cd dist && shasum -a 256 avdslim_*.tar.gz > checksums.txt && cat checksums.txt )

          # Guard the contract between this file and install.sh.
          if grep -q ' \./' dist/checksums.txt; then
            echo "::error::checksums.txt contains './'-prefixed filenames; install.sh will not match them"
            exit 1
          fi

      # Cryptographic provenance tying these artifacts to this repo, commit and
      # workflow. checksums.txt alone only proves the download wasn't corrupted;
      # it says nothing about who produced it. Verify with:
      #   gh attestation verify avdslim_<ver>_<os>_<arch>.tar.gz --repo kdbhalala/avdslim
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: 'dist/*.tar.gz'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/*.tar.gz
            dist/checksums.txt
          generate_release_notes: true
