version: 2
updates:
  # Actions are pinned to full commit SHAs for supply-chain safety, which means
  # they never pick up upstream fixes on their own. Dependabot rewrites the pins
  # (keeping the trailing "# vN" comment) so pinning does not turn into rot.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci

  # No third-party requires today, but this catches it if one is ever added,
  # and picks up Go toolchain security updates in go.mod.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
