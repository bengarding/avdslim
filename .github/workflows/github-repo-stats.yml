name: GitHub Repo Stats

on:
  schedule:
    # Run daily at 23:45 UTC to capture full-day traffic stats
    - cron: "45 23 * * *"
  workflow_dispatch: # Allow manual on-demand execution

concurrency:
  group: github-repo-stats
  cancel-in-progress: false

permissions: {}

jobs:
  collect-stats:
    name: Collect & Archive Repository Stats
    runs-on: ubuntu-latest
    permissions:
      contents: write  # pushes collected stats to the databranch
    steps:
      # Pinned to the exact commit the RELEASE branch pointed at (v1.4.2 build).
      # `@RELEASE` is a *branch* head, so it silently changes under us — this is
      # third-party code that receives a token with write access to this repo.
      # To upgrade: re-resolve the branch head and bump this SHA deliberately.
      - name: Run GitHub Repo Stats
        uses: jgehrcke/github-repo-stats@d80572c9029636cd0e97e3a79e7a9c293bea3b02 # RELEASE @ v1.4.2
        with:
          repository: ${{ github.repository }}
          # Prefer the scoped, job-lifetime GITHUB_TOKEN. Only fall back to a PAT
          # if one is configured; a PAT here should be fine-grained and limited to
          # this repository, since it is handed to third-party code.
          ghtoken: ${{ secrets.GHRS_GITHUB_API_TOKEN || secrets.GITHUB_TOKEN }}
          databranch: github-repo-stats
